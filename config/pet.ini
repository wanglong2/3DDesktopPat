# Paths are relative to this file. Leave model empty for the built-in demo pet.
model = ../团子.glb
window_width = 360
window_height = 400
window_x = -1
window_y = -1
always_on_top = true
fps = 60
model_height = 1.9
camera_distance = 7.0
camera_elevation = 18
camera_target_y = 0.45
animation_fps = 60
blend_seconds = 0.20
auto_walk = true
walk_speed = 24
walk_interval = 5
walk_duration = 1.6

# A clip may be a name, several alternatives separated by |, or a zero-based #index.
# Run crose_pet --list-animations to see the names in your GLB.
idle = Idle_Base|Idle_Var2
move = Run_Base|Run_Haste
left_click = Interact|Joke
right_click = Celebrate|Dance_In
exit = Death|Recall
